{% extends "base.html" %}
{% block title %}Yeni Mesaj - TG Portal{% endblock %}
{% block page_title %}Yeni Mesaj{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <a href="{{ url_for('mesaj.index') }}" class="text-indigo-600 hover:text-indigo-800 flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">arrow_back</span>
            Mesajlara Don
        </a>
    </div>

    <div class="bg-white dark:bg-card-dark rounded-xl border border-border-light dark:border-border-dark shadow-sm">
        <div class="p-6 border-b border-gray-100 dark:border-gray-700">
            <h2 class="text-lg font-bold text-gray-900 dark:text-white">Yeni Mesaj Olustur</h2>
        </div>

        <form action="{{ url_for('mesaj.yeni') }}" method="POST" enctype="multipart/form-data" class="p-6 space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Alici *</label>
                <select name="alici_id" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-800 dark:border-gray-600 dark:text-white">
                    <option value="">Kisi secin...</option>
                    {% for user in kullanicilar %}
                    <option value="{{ user.id }}" {% if secili_alici and secili_alici|string == user.id|string %}selected{% endif %}>
                        {{ user.ad_soyad }} {% if user.departman %}({{ user.departman }}){% endif %}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Konu</label>
                <input type="text" name="konu" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-800 dark:border-gray-600 dark:text-white" placeholder="Mesaj konusu">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Mesaj *</label>
                <textarea name="icerik" rows="6" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-800 dark:border-gray-600 dark:text-white" placeholder="Mesajinizi yazin..."></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Dosya Eki</label>
                <input type="file" name="dosya" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-800 dark:border-gray-600 dark:text-white">
                <p class="text-xs text-gray-500 mt-1">PDF, Word, Excel, resim veya ZIP dosyalari yukleyebilirsiniz.</p>
            </div>

            <div class="flex gap-3 pt-4">
                <button type="submit" class="px-6 py-2 bg-primary hover:bg-primary-dark text-white rounded-lg font-medium">
                    Gonder
                </button>
                <a href="{{ url_for('mesaj.index') }}" class="px-6 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50">
                    Iptal
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
