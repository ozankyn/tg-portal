{% extends "base.html" %}

{% block title %}{{ 'Düzenle' if tuzel_kisi else 'Yeni' }} Tüzel Kişi - TG Portal{% endblock %}
{% block page_title %}{{ 'Tüzel Kişi Düzenle' if tuzel_kisi else 'Yeni Tüzel Kişi' }}{% endblock %}

{% block content %}
<div class="max-w-2xl">
    <div class="bg-white dark:bg-card-dark rounded-xl shadow-sm border border-border-light dark:border-border-dark">
        <div class="px-4 py-3 border-b border-border-light dark:border-border-dark">
            <h6 class="font-semibold text-[#111418] dark:text-white flex items-center gap-2">
                <span class="material-symbols-outlined">business</span>
                Şirket Bilgileri
            </h6>
        </div>
        <form method="POST" class="p-4 space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Şirket Unvanı <span class="text-red-500">*</span></label>
                    <input type="text" name="ad" required value="{{ tuzel_kisi.ad if tuzel_kisi else '' }}"
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-[#1a1f2e] text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Kısa Ad</label>
                    <input type="text" name="kisa_ad" value="{{ tuzel_kisi.kisa_ad if tuzel_kisi else '' }}"
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-[#1a1f2e] text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Vergi No</label>
                    <input type="text" name="vergi_no" maxlength="11" value="{{ tuzel_kisi.vergi_no if tuzel_kisi else '' }}"
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-[#1a1f2e] text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Vergi Dairesi</label>
                    <input type="text" name="vergi_dairesi" value="{{ tuzel_kisi.vergi_dairesi if tuzel_kisi else '' }}"
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-[#1a1f2e] text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">MERSİS No</label>
                    <input type="text" name="mersis_no" value="{{ tuzel_kisi.mersis_no if tuzel_kisi else '' }}"
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-[#1a1f2e] text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Telefon</label>
                    <input type="tel" name="telefon" value="{{ tuzel_kisi.telefon if tuzel_kisi else '' }}"
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-[#1a1f2e] text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">E-posta</label>
                    <input type="email" name="email" value="{{ tuzel_kisi.email if tuzel_kisi else '' }}"
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-[#1a1f2e] text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Adres</label>
                    <textarea name="adres" rows="2"
                              class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-[#1a1f2e] text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500">{{ tuzel_kisi.adres if tuzel_kisi else '' }}</textarea>
                </div>
                
                <div class="md:col-span-2">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="aktif" {{ 'checked' if not tuzel_kisi or tuzel_kisi.aktif else '' }}
                               class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        <span class="text-sm text-gray-700 dark:text-gray-300">Aktif</span>
                    </label>
                </div>
            </div>
            
            <div class="flex gap-3 pt-4 border-t border-border-light dark:border-border-dark">
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition-colors">
                    <span class="material-symbols-outlined align-middle mr-1">save</span>Kaydet
                </button>
                <a href="{{ url_for('sirket.liste') }}" class="px-4 py-2 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 font-medium rounded-lg hover:bg-gray-50 dark:hover:bg-[#252b36] transition-colors">
                    İptal
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
